name: Windows build and native checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'tests/**', 'assets/**', 'licenses/**', 'Scripts/**', '.github/workflows/**', 'README.txt', 'LICENSE', 'LICENSES.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - name: Compile, validate Windows core, capture native Forms
        shell: pwsh
        run: ./Scripts/build.ps1 -Capture
      - name: Preserve bundle and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BorisRay-Windows-x64
          path: |
            artifacts/BorisRay-Windows-x64-*.zip
            artifacts/BorisRay-Windows-Setup-x64-*.exe
            artifacts/installer-check.json
            artifacts/SHA256SUMS
            artifacts/build.json
            artifacts/review/
          retention-days: 3
          if-no-files-found: error
